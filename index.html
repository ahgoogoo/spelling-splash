<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelling Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout concept: one sunlit-ocean world. Chunky buttons, big type, a deep-water play field,
   and a calm white "classroom" surface for teacher tools. Single committed look (no dark mode). */
:root{
  --sky:#e6f7ff; --foam:#ffffff; --deep:#06294d; --sea:#0b62a8; --aqua:#1cc2d6;
  --sun:#ffc21a; --sun-d:#c98f00; --coral:#c9301f; --kelp:#0e8f4b; --line:#b4dcf0; --ink2:#2b4a6b;
  --f-disp:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
/* Easy-read option: one evenly spaced face everywhere */
html.dys{--f-disp:'Lexend','Verdana',sans-serif;--f-body:'Lexend','Verdana',sans-serif}
html.dys body{letter-spacing:.04em;word-spacing:.14em;line-height:1.75}

html,body{height:100%}
*{box-sizing:border-box}
body{
  background:var(--sky);color:var(--deep);
  font:400 1.1rem/1.5 var(--f-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:700}
h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600}
h3{font-size:1.3rem;font-weight:600}
p{margin:0}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

/* ---------- animated sea ---------- */
.sea{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(#bfeaff 0%,#e6f7ff 55%,#c7efee 100%)}
.sea i{position:absolute;bottom:-60px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}
.shell{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:1100px;margin:0 auto}
#app{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:1.5rem}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.7rem 0}
.brand{font:700 1.5rem var(--f-disp);background:none;border:0;cursor:pointer;color:var(--deep);padding:.3rem .2rem}
.brand span{color:var(--sea)}
.tools{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{min-height:44px;padding:.3rem .9rem;border-radius:999px;border:2px solid var(--deep);background:#fff;cursor:pointer;font-weight:700;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--sun)}
.chip.armed{background:var(--coral);color:#fff}

/* ---------- buttons & cards ---------- */
.btn{min-height:56px;padding:.55rem 1.5rem;border-radius:18px;border:3px solid var(--deep);border-bottom-width:6px;
  background:#fff;color:var(--deep);font:600 1.2rem var(--f-disp);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
.btn.primary{background:var(--sun)}
.btn.blue{background:var(--sea);color:#fff}
.btn.danger{background:var(--coral);color:#fff}
.btn.small{min-height:44px;padding:.25rem 1rem;font-size:1rem;border-bottom-width:4px}
.btn.armed{background:var(--coral);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:3px solid var(--deep);border-radius:24px;padding:1.2rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--ink2)}
.err{background:#ffe3df;border:3px solid var(--coral);color:#7a1208;border-radius:16px;padding:.7rem 1rem;font-weight:700}
.ok-note{background:#dcf7e8;border:3px solid var(--kelp);border-radius:16px;padding:.7rem 1rem;font-weight:700}
label{display:block;font-weight:700;margin-bottom:.3rem}
input[type=text],input[type=password],select,textarea{width:100%;min-height:56px;padding:.6rem 1rem;border-radius:16px;border:3px solid var(--deep);background:#fff;font-size:1.2rem}
textarea{min-height:160px;resize:vertical}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;gap:1.6rem;align-items:center;text-align:center;padding-top:1rem}
.lead{font-size:1.3rem;max-width:34ch}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;width:100%}
.role{display:flex;flex-direction:column;gap:.5rem;align-items:center;justify-content:center;min-height:200px;padding:1.5rem;border-radius:32px;border:4px solid var(--deep);border-bottom-width:10px;cursor:pointer;text-align:center}
.role b{font:700 clamp(1.8rem,5vw,2.5rem) var(--f-disp)}
.role span{font-size:1.1rem}
.role.t{background:#fff}
.role.s{background:var(--sun)}
.role:active{transform:translateY(5px);border-bottom-width:5px}
.logo{display:flex;gap:.2rem;justify-content:center;font:700 clamp(2.6rem,9vw,4.6rem) var(--f-disp)}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ---------- forms ---------- */
.form{max-width:520px;width:100%;margin:1rem auto 0}
.codein{font:700 3rem var(--f-disp)!important;text-align:center;letter-spacing:.35em;text-transform:uppercase;padding-left:.35em!important}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tab{min-height:50px;padding:.3rem 1.2rem;border-radius:16px 16px 0 0;border:3px solid var(--deep);border-bottom:0;background:#fff;font:600 1.15rem var(--f-disp);cursor:pointer}
.tab.on{background:var(--sun)}
.panel{border:3px solid var(--deep);border-radius:0 24px 24px 24px;background:#fff;padding:1.2rem;margin-top:-3px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem}
.lcard{border:3px solid var(--line);border-radius:20px;padding:1rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.lcard h3{overflow-wrap:anywhere}
.words{display:flex;flex-wrap:wrap;gap:.4rem}
.words span{background:var(--sky);border:2px solid var(--line);border-radius:999px;padding:.1rem .7rem;font-size:1rem}

/* ---------- setup ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
.opt{border:3px solid var(--deep);border-radius:20px;background:#fff;padding:.9rem;text-align:left;cursor:pointer;min-height:84px}
.opt b{display:block;font:600 1.25rem var(--f-disp)}
.opt.on{background:var(--sun);box-shadow:0 0 0 4px var(--deep) inset}
.speeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem}
.speeds .opt{text-align:center}
.speeds .em{font-size:1.8rem;display:block}

/* ---------- lobby / teacher room ---------- */
.bigcode{font:700 clamp(4.5rem,18vw,9rem) var(--f-disp);letter-spacing:.18em;padding-left:.18em;background:#fff;border:5px solid var(--deep);border-radius:36px;text-align:center;line-height:1.1;padding-block:.3rem}
.players{display:flex;flex-wrap:wrap;gap:.6rem}
.pchip{display:flex;align-items:center;gap:.4rem;background:#fff;border:3px solid var(--deep);border-radius:999px;padding:.2rem .3rem .2rem 1rem;font:600 1.2rem var(--f-disp);animation:pin .3s}
.pchip.stale{opacity:.55}
.pchip button{min-width:38px;min-height:38px;border-radius:50%;border:2px solid var(--deep);background:var(--sky);cursor:pointer;font-weight:700}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.lb{display:flex;flex-direction:column;gap:.5rem}
.lrow{display:grid;grid-template-columns:2.6rem minmax(5rem,11rem) 1fr minmax(6rem,auto);gap:.6rem;align-items:center;background:#fff;border:3px solid var(--deep);border-radius:18px;padding:.4rem .8rem}
.lrow .rk{font:700 1.5rem var(--f-disp);text-align:center}
.lrow .nm{font:600 1.2rem var(--f-disp);overflow-wrap:anywhere}
.lrow .bar{height:22px;background:var(--sky);border:2px solid var(--deep);border-radius:999px;overflow:hidden}
.lrow .bar i{display:block;height:100%;width:0;background:var(--aqua);transition:width .8s ease}
.lrow.done .bar i{background:var(--kelp)}
.lrow .sc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:560px){.lrow{grid-template-columns:2rem 1fr auto}.lrow .bar{grid-column:1/-1;order:5}}
.timer{font:700 clamp(2.4rem,8vw,4rem) var(--f-disp);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{padding:.55rem .7rem;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap}
th{font:600 1rem var(--f-disp);background:var(--sky)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- game ---------- */
.game{flex:1;display:flex;flex-direction:column;gap:.5rem;min-height:0}
.hud{display:flex;gap:.5rem;flex-wrap:wrap;align-items:stretch}
.stat{flex:1 1 84px;background:#fff;border:3px solid var(--deep);border-radius:16px;padding:.15rem .6rem;text-align:center}
.stat span{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}
.stat b{font:700 1.7rem/1.2 var(--f-disp);font-variant-numeric:tabular-nums}
.hudbtns{display:flex;gap:.5rem}
.top3{min-height:2.2rem;display:flex;gap:.5rem;flex-wrap:wrap;font-weight:700;font-size:.95rem}
.top3 span{background:#fff;border:2px solid var(--deep);border-radius:999px;padding:.1rem .8rem}
.field{position:relative;flex:1;min-height:250px;overflow:hidden;border-radius:24px;border:4px solid var(--deep);
  background:linear-gradient(#63cdf2 0%,#1b86cf 45%,#06294d 100%)}
.field::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.07) 0 30px,transparent 30px 90px);pointer-events:none}
.word{position:absolute;left:0;top:0;will-change:transform}
.wi{white-space:pre;background:#fff;color:var(--deep);border:3px solid var(--deep);border-radius:999px;padding:.05em .7em;
  font:700 clamp(1.6rem,4.4vw,2.4rem) var(--f-body);letter-spacing:.05em}
.word.target .wi{box-shadow:0 0 0 5px var(--sun)}
.ch.hit{color:#067a38;background:#c6f4da;border-radius:6px}
.word.shake .wi{animation:shake .38s}
.word.pop .wi{animation:pop .38s forwards}
.word.splash .wi{animation:splash .45s forwards;border-color:var(--coral)}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{40%{transform:scale(1.25);background:var(--sun)}100%{transform:scale(0);opacity:0}}
@keyframes splash{to{transform:translateY(20px) scale(.4);opacity:0}}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.floater{position:absolute;font:700 1.6rem var(--f-disp);color:#fff;text-shadow:0 2px 0 var(--deep);animation:floatup 1s forwards;pointer-events:none}
@keyframes floatup{to{transform:translateY(-50px);opacity:0}}
.typebar{display:flex;gap:.5rem}
.typebar input{flex:1;min-width:0;min-height:68px;font:700 2rem var(--f-body);text-align:center;letter-spacing:.06em;border-width:4px}
.typebar input.bad{animation:shake .3s;border-color:var(--coral)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;background:rgba(6,41,77,.78);color:#fff;z-index:5;text-align:center;padding:1rem}
.overlay .big{font:700 clamp(6rem,30vw,14rem) var(--f-disp);line-height:1;animation:cd 1s infinite}
@keyframes cd{0%{transform:scale(1.4);opacity:0}30%{transform:scale(1);opacity:1}}
.fullcd{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(6,41,77,.9);color:#fff}

/* ---------- waiting & end ---------- */
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.2rem;padding-top:1.5rem}
.fish{font-size:4rem;animation:bob 2s ease-in-out infinite}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;width:100%}
.stats4 .stat b{font-size:2.1rem}
.medal{font:700 clamp(2.4rem,8vw,3.6rem) var(--f-disp);background:var(--sun);border:4px solid var(--deep);border-radius:28px;padding:.4rem 1.6rem}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:.6rem;height:270px;width:100%;max-width:520px;margin:0 auto}
.pl{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:.3rem;flex:1 1 0;min-width:0;opacity:0;animation:fadein .5s forwards}
.pl .nm{font:600 1.1rem var(--f-disp);overflow-wrap:anywhere;text-align:center;line-height:1.2}
.pl .blk{width:100%;border:4px solid var(--deep);border-bottom:0;border-radius:18px 18px 0 0;font:700 2.4rem var(--f-disp);display:flex;align-items:flex-start;justify-content:center;height:0;animation:grow 1s .3s forwards}
.pl.p1 .blk{background:var(--sun);--h:170px}
.pl.p2 .blk{background:#dbe7f0;--h:120px}
.pl.p3 .blk{background:#f0b98a;--h:80px}
.pl.me .nm{background:var(--sun);border-radius:999px;padding:0 .6rem}
@keyframes grow{to{height:var(--h)}}
@keyframes fadein{to{opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.practise{display:flex;flex-wrap:wrap;gap:.5rem}
.practise span{background:#fff;border:3px solid var(--deep);border-radius:16px;padding:.2rem .9rem;font:700 1.3rem var(--f-body);letter-spacing:.05em}

#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--deep);color:#fff;border-radius:999px;padding:.7rem 1.4rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}.sea i{display:none}}
</style>
</head>
<body>

<div class="sea" id="sea" aria-hidden="true"></div>
<div class="shell">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="Spelling Splash home">Spelling <span>Splash</span></button>
    <div class="tools">
      <button class="chip" id="btnSound" data-act="sound" aria-pressed="false">Sound: On</button>
      <button class="chip" id="btnFont" data-act="font" aria-pressed="false">Easy-read font</button>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   SPELLING SPLASH
   Data kept in the artifact's shared db (never localStorage, except tiny per-device prefs):
     settings/school                      { pinHash }
     lists/{id}                           { name, words[], count, createdAt, updatedAt }
     rooms/{CODE}                         { code, listId, listName, words[], mode, speed, limitSec,
                                            status, round, startAt, seed, removed[], createdAt, expiresAt }
     rooms/{CODE}/players/{slug}          one record per student, written only by that student:
                                          { name, token, round, lastSeen, correct, missed, slips, keysOk,
                                            keysBad, bestStreak, progress, done, timeMs, elapsedMs,
                                            penaltyMs, seqIdx, trouble[{w,m,s}], cleared[] }
   ===================================================================== */

/* ---------- constants ---------- */
var SPEEDS=[
  {k:'snail',name:'Snail',em:'🐌',cross:24},
  {k:'turtle',name:'Turtle',em:'🐢',cross:17},
  {k:'rabbit',name:'Rabbit',em:'🐇',cross:12},
  {k:'cheetah',name:'Cheetah',em:'🐆',cross:8.5},
  {k:'rocket',name:'Rocket',em:'🚀',cross:6}
];
var STARTER=['because','friend','people','school','enough','thought','beautiful','favourite','different','together','library','February','Wednesday','believe','neighbour','strength','island','answer','minute','special'];
var DAY=24*3600*1000;
var LETTERS='ACFHJKMRSWXZ';          // easy to say aloud, no vowels except A (avoids accidental words)
var PENALTY_MS=3000;                  // fastest-time mode: word reached the bottom
var MAX_ACTIVE=4;

/* ---------- tiny helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var now=function(){return Date.now()};
function mkStore(area){return {
  get:function(k,d){try{var v=window[area].getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{window[area].setItem(k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{window[area].removeItem(k)}catch(e){}}
}}
var store=mkStore('localStorage'), sess=mkStore('sessionStorage');
var CLIENT_ID=(function(){var v=store.get('sp_cid',null);if(!v){v=Math.random().toString(36).slice(2)+now().toString(36);store.set('sp_cid',v)}return v})();
function fmtTime(ms,tenths){ms=Math.max(0,ms);var s=Math.floor(ms/1000),m=Math.floor(s/60);var t=m+':'+String(s%60).padStart(2,'0');if(tenths)t+='.'+Math.floor((ms%1000)/100);return t}
function fmtDate(ms){return new Date(ms).toLocaleString('en-SG',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},3200)}

/* ---------- word list cleaning: split, trim, collapse spaces, drop blanks and duplicates ---------- */
function cleanWords(text){
  var parts=String(text||'').split(/[\n\r,;\t]+/),seen={},out=[];
  parts.forEach(function(p){
    var w=p.replace(/\s+/g,' ').trim();
    if(!w||w.length>30)return;
    var k=w.toLowerCase();
    if(seen[k])return;
    seen[k]=1;out.push(w);
  });
  return out;
}
/* seeded shuffle so every device gets the same word order */
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){var a=arr.slice(),r=rng(seed);for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- names / codes ---------- */
function cleanName(n){return String(n||'').replace(/[<>&"]/g,'').replace(/\s+/g,' ').trim().slice(0,14)}
function slugOf(n){return 'p'+Array.from(n.toLowerCase()).map(function(c){return c.codePointAt(0).toString(36)}).join('-')}
function randCode(){var c='';for(var i=0;i<4;i++)c+=LETTERS[Math.floor(Math.random()*LETTERS.length)];return c}

/* ---------- scoring ---------- */
function accOf(p){var t=(p.correct||0)+(p.missed||0);return t?(p.correct||0)/t:0}
function accText(p){var t=(p.correct||0)+(p.missed||0);return t?Math.round(100*(p.correct||0)/t)+'%':'–'}
/* Rank: Most words = score then accuracy. Fastest time = finished first, quickest time, then accuracy. Ties share a rank. */
function rankPlayers(list,mode){
  var a=list.map(function(p){return Object.assign({},p)});
  function key(p){return mode==='fastest'
    ? (p.done?'D'+p.timeMs:'U'+(p.correct||0))+'|'+accOf(p).toFixed(4)
    : (p.correct||0)+'|'+accOf(p).toFixed(4)}
  a.sort(function(x,y){
    if(mode==='fastest'){
      if(!!x.done!==!!y.done)return x.done?-1:1;
      if(x.done&&x.timeMs!==y.timeMs)return x.timeMs-y.timeMs;
      if(!x.done&&(y.correct||0)!==(x.correct||0))return (y.correct||0)-(x.correct||0);
    }else if((y.correct||0)!==(x.correct||0))return (y.correct||0)-(x.correct||0);
    var d=accOf(y)-accOf(x);if(d)return d;
    return String(x.name).localeCompare(String(y.name));
  });
  a.forEach(function(p,i){p._rank=(i>0&&key(a[i-1])===key(p))?a[i-1]._rank:i+1});
  return a;
}

/* ---------- sound (WebAudio, no files) ---------- */
var Snd={
  ctx:null,muted:store.get('muted',false),
  init:function(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone:function(f,d,type,vol,when,slide){
    if(this.muted||!this.ctx)return;

   FIREBASE REALTIME DATABASE ADAPTER
   Gives the game the same doc()/collection() calls it was written against.
   Each "document" lives at   sp/<path>/_   so sub-collections (a room's players) sit beside it
   and writing a room never overwrites its players.
   ===================================================================== */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyBpw2t0H0BTOFH91u5teOuQGxOQSIhNkQI",
  authDomain:"spelling-splash.firebaseapp.com",

function makeFirebaseDB(rtdb){
  function ref(p){return rtdb.ref('sp/'+p)}
  function clean(o){return JSON.parse(JSON.stringify(o))}          // drops undefined, which Firebase rejects
  function mkDoc(id,val){var ok=val!==null&&val!==undefined;return {id:id,exists:ok,data:function(){return ok?val:undefined}}}
  function mkQuery(snap){
    var docs=[];
    snap.forEach(function(c){var v=c.val();if(v&&v._!==undefined&&v._!==null)docs.push(mkDoc(c.key,v._))});
    return {docs:docs,size:docs.length,empty:!docs.length};
  }
  function docRef(path){
    var parts=path.split('/'),id=parts[parts.length-1],r=ref(path+'/_');
    return {
      get:function(){return r.get().then(function(s){return mkDoc(id,s.val())})},
      set:function(d){return r.set(clean(d))},
      update:function(d){return r.update(clean(d))},
      delete:function(){return r.remove()},
      onSnapshot:function(next,err){var h=function(s){next(mkDoc(id,s.val()))};r.on('value',h,err);return function(){r.off('value',h)}}
    };
  }
  function colRef(path){
    var r=ref(path);
    return {
      get:function(){return r.get().then(mkQuery)},
      onSnapshot:function(next,err){var h=function(s){next(mkQuery(s))};r.on('value',h,err);return function(){r.off('value',h)}}
    };
  }
  return {doc:docRef,collection:colRef};
}

async function dbRetry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*400);return await fn()}throw e}}
/* Realtime subscription plus a gentle polling fallback so updates still arrive about every 2-4 s. */
function watch(getRef,cb){
  var last=now(),dead=false,unsub=null;
  function handle(snap){last=now();if(!dead)cb(snap)}
  try{unsub=getRef().onSnapshot(handle,function(e){console.warn('watch',e)})}catch(e){}
  var timer=setInterval(async function(){
    if(dead||now()-last<3000)return;
    try{handle(await getRef().get())}catch(e){}
  },2000);
  return function(){dead=true;clearInterval(timer);if(unsub)try{unsub()}catch(e){}};
}
/* One write at a time per document; the newest data wins. */
function makeWriter(path){
  var busy=null,pending=null;
  function flush(){
    if(busy)return busy;
    busy=(async function(){
      try{while(pending){var d=pending;pending=null;try{await dbRetry(function(){return DB.doc(path).set(d)})}catch(e){console.warn('write',e)}}}
      finally{busy=null}
    })();
    return busy;
  }
  return {write:function(d){pending=d;return flush()}};
}

}

function spawn(ts){
  if(G.active.length>=G.maxActive){G.nextSpawn=ts+300;return}
  var word=null;
  if(G.mode==='most'){
    for(var k=0;k<4;k++){
      var w=seqWord(G.seqIdx);
      if(G.words.length<=G.maxActive||!G.active.some(function(a){return a.lower===w.toLowerCase()})){word=w;break}

  if(!word){G.nextSpawn=ts+400;return}
  var el=makeWordEl(word);G.field.appendChild(el);
  var w2=el.offsetWidth,h=el.offsetHeight,x=null;
  for(var t=0;t<30;t++){
    var cx=8+Math.random()*Math.max(0,G.W-w2-16);
    var clash=G.active.some(function(a){return a.y<h*2.4&&cx<a.x+a.w+14&&cx+w2+14>a.x});
    if(!clash){x=cx;break}
  }
  if(x===null){el.remove();G.nextSpawn=ts+250;return}
  if(G.mode==='most')G.seqIdx++;else G.queue.shift();
  var item={word:word,lower:word.toLowerCase(),el:el,x:x,y:-h-4,w:w2,h:h,slipped:false,spans:$$('.ch',el)};
  el.style.transform='translate('+x+'px,'+item.y+'px)';
  G.active.push(item);
  if(S.hear)speak(word);
  G.nextSpawn=ts+G.interval*(0.85+Math.random()*0.3);
  if(G.active.length===1)G.nextSpawn=Math.min(G.nextSpawn,ts+1500);
}
function loop(ts){
  if(!G||G.over)return;
  G.raf=requestAnimationFrame(loop);
  if(G.paused){G.last=ts;return}
  var dt=Math.min(0.08,(ts-G.last)/1000);G.last=ts;
  G.elapsed=Math.max(0,ts-G.t0);
  if(ts>=G.nextSpawn)spawn(ts);
  var v=G.H/G.cross;
  for(var i=G.active.length-1;i>=0;i--){
    var w=G.active[i];w.y+=v*dt;
    w.el.style.transform='translate('+w.x+'px,'+w.y+'px)';
    if(w.y+w.h>=G.H)missWord(w);
  }
  hud();
  if(G.mode==='most'){
    var left=G.limitMs-G.elapsed;
    if(!G.solo&&!G.top3Hidden&&left<=10000){G.top3Hidden=true;updateTop3()}  // suspense: hide Top 3 for the last 10 seconds
    if(left<=0)endGame('time');
  }else if(!G.queue.length&&!G.active.length)endGame('cleared');
}
function hud(){
  var sec=Math.floor(G.elapsed/1000);
  if(sec!==G.lastSec||true){
    G.lastSec=sec;
    $('#hScore').textContent=G.correct;$('#hStreak').textContent=G.streak;
    if(G.mode==='most'){$('#hTime').textContent=fmtTime(G.limitMs-G.elapsed);$('#hLeft').textContent=G.missed}
    else{$('#hTime').textContent=fmtTime(G.elapsed+G.penaltyMs,true);$('#hLeft').textContent=G.queue.length+G.active.length}
  }
}
function addTrouble(word,kind){
  var t=G.trouble.get(word);if(!t){t={w:word,m:0,s:0};G.trouble.set(word,t)}
  t[kind]++;
}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(function(){el.classList.remove('shake')},400)}
function setTarget(t,n){
  if(G.target&&G.target!==t){G.target.el.classList.remove('target');G.target.spans.forEach(function(s){s.classList.remove('hit')})}
  G.target=t;
  if(t){t.el.classList.add('target');t.spans.forEach(function(s,i){s.classList.toggle('hit',i<n)})}
}
function lowest(){var b=null;G.active.forEach(function(a){if(!b||a.y>b.y)b=a});return b}
/* Typing: case-insensitive, matched letters highlight, a wrong letter is simply not accepted (gentle shake, no penalty). */
function onTyper(){
  if(!G||G.over||G.paused){G&&G.typer&&(G.typer.value='');return}
  var v=G.typer.value.toLowerCase().replace(/^\s+/,'');
  if(!v){setTarget(null);G.typed='';G.typer.value='';return}
  var cands=G.active.filter(function(w){return w.lower.indexOf(v)===0});
  if(!cands.length){
    G.keysBad++;G.dirty=true;Snd.oops();
    if(G.target){if(!G.target.slipped){G.target.slipped=true;G.slips++;addTrouble(G.target.word,'s')}shake(G.target.el)}
    G.typer.classList.remove('bad');void G.typer.offsetWidth;G.typer.classList.add('bad');
    G.typer.value=G.typed;
    return;
  }
  G.keysOk++;
  var exact=cands.filter(function(w){return w.lower===v}).sort(function(a,b){return b.y-a.y})[0];
  if(exact){destroy(exact);return}
  var t=(G.target&&cands.indexOf(G.target)>-1)?G.target:cands.sort(function(a,b){return b.y-a.y})[0];
  setTarget(t,v.length);G.typed=v;
}
function burst(x,y){
  var cols=['#ffc21a','#1cc2d6','#ffffff','#ff7a59'];
  for(var i=0;i<9;i++){
    var s=document.createElement('i');s.className='spark';
    var a=Math.PI*2*i/9,d=40+Math.random()*30;
    s.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[i%4]+';--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px';
    G.field.appendChild(s);setTimeout(function(n){return function(){n.remove()}}(s),650);
  }
}
function removeActive(w){var i=G.active.indexOf(w);if(i>-1)G.active.splice(i,1)}
function destroy(w){
  removeActive(w);
  w.el.classList.add('pop');burst(w.x+w.w/2,w.y+w.h/2);
  setTimeout(function(){w.el.remove()},400);
  G.correct++;G.streak++;if(G.streak>G.bestStreak)G.bestStreak=G.streak;
  G.cleared.add(w.lower);G.dirty=true;
  G.target=null;G.typed='';G.typer.value='';
  Snd.pop();
  if(!G.active.length)G.nextSpawn=Math.min(G.nextSpawn,performance.now()+500);
}
function missWord(w){
  removeActive(w);
  w.el.classList.add('splash');setTimeout(function(){w.el.remove()},450);
  G.missed++;G.streak=0;addTrouble(w.word,'m');G.dirty=true;Snd.miss();
  if(G.mode!=='most'){
    G.queue.push(w.word);                       // returns later
    if(G.penaltyPer){G.penaltyMs+=G.penaltyPer;floater('+3s',w.x)}
  }
  if(G.target===w){G.target=null}
  // clear typed text if it no longer matches anything on screen
  var v=G.typer.value.toLowerCase();
  if(v&&!G.active.some(function(a){return a.lower.indexOf(v)===0})){G.typer.value='';G.typed='';setTarget(null)}
}
function floater(text,x){
  var f=document.createElement('div');f.className='floater';f.textContent=text;
  f.style.cssText='left:'+Math.max(8,Math.min(x,G.W-70))+'px;bottom:14px';G.field.appendChild(f);setTimeout(function(){f.remove()},1000);
}
/* Write this student's own record (only ever their own document) */
function buildDoc(done){
  var total=G.total||0,cl=G.cleared.size;
  return {name:S.player.name,token:CLIENT_ID,round:S.player.round,joinedAt:S.player.joinedAt,lastSeen:now(),
    correct:G.correct,missed:G.missed,slips:G.slips,keysOk:G.keysOk,keysBad:G.keysBad,bestStreak:G.bestStreak,
    progress:G.mode==='most'?Math.min(1,G.elapsed/G.limitMs):(total?Math.min(1,cl/total):0),
    done:!!done,
    timeMs:done?(G.mode==='most'?G.limitMs:Math.round(G.elapsed+G.penaltyMs)):0,
    elapsedMs:Math.round(G.elapsed),penaltyMs:G.penaltyMs,seqIdx:G.seqIdx,
    trouble:Array.from(G.trouble.values()),
    cleared:G.mode==='fastest'?Array.from(G.cleared):[]};
}
function pushStats(done){if(!G||G.solo)return Promise.resolve();var d=buildDoc(done);S.player=d;return G.writer.write(d)}
/* Time label helper for the end screen */
function endFromDoc(d,room){
  return {solo:false,mode:room.mode,correct:d.correct,missed:d.missed,keysOk:d.keysOk,keysBad:d.keysBad,bestStreak:d.bestStreak,
    timeMs:d.timeMs,done:d.done,trouble:d.trouble||[]};
}
async function endGame(reason){
  if(!G||G.over)return;
  G.over=true;cancelAnimationFrame(G.raf);clearInterval(G.pushTimer);
  try{G.ro.disconnect()}catch(e){}
  G.active.forEach(function(w){w.el.remove()});
  var completed=(reason==='time'||reason==='cleared');
  var timeMs=G.mode==='most'?(completed?G.limitMs:Math.round(G.elapsed)):Math.round(G.elapsed+G.penaltyMs);
  S.end={solo:G.solo,mode:G.mode,correct:G.correct,missed:G.missed,keysOk:G.keysOk,keysBad:G.keysBad,bestStreak:G.bestStreak,
    timeMs:timeMs,done:completed,trouble:Array.from(G.trouble.values())};
  S.podium=false;
  Snd.win();
  showEnd();
  if(!G.solo){
    G.elapsed=G.mode==='most'?G.limitMs:G.elapsed;
    var d=buildDoc(completed);d.timeMs=completed?timeMs:0;S.player=d;
    await G.writer.write(d);
  }
}

    var next=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    var sig=function(a){return a.map(function(l){return l.id+':'+(l.updatedAt||0)}).sort().join('|')};
    var changed=sig(next)!==sig(S.lists);

  }));
}

/* The host's device ends the round when everyone has finished or the time is up (no teacher is watching). */
function hostTick(){
  var r=S.room;if(!r||!isHost()||r.status!=='running'||S.hostEnding)return;
  var el=now()-r.startAt;
  var cur=S.players.filter(function(p){return p.round===r.round});
  var allDone=cur.length>0&&cur.every(function(p){return p.done});

  var el2=$('#lvTimer');

  if(el2)el2.textContent=r.mode==='most'?fmtTime(r.limitSec*1000-elapsed):fmtTime(elapsed);
  var cur=curPlayers(),allDone=cur.length>0&&cur.every(function(p){return p.done});

  var agg={};
  curPlayers().forEach(function(p){(p.trouble||[]).forEach(function(t){var a=agg[t.w]||(agg[t.w]={w:t.w,m:0,s:0,kids:0});a.m+=t.m||0;a.s+=t.s||0;if(t.m||t.s)a.kids++})});
  var miss=Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){return (b.m*2+b.s)-(a.m*2+a.s)}).slice(0,12);
  S.report={ranked:ranked,miss:miss};
  var t=$('#repTable');if(!t)return;
  t.innerHTML=ranked.length?'<table><thead><tr><th class="n">Rank</th><th>Name</th><th class="n">Words right</th><th class="n">Accuracy</th><th class="n">Time</th><th class="n">Missed</th></tr></thead><tbody>'
    +ranked.map(function(p){return '<tr><td class="n"><b>'+p._rank+'</b></td><td>'+esc(p.name)+'</td><td class="n">'+(p.correct||0)+'</td><td class="n">'+accText(p)+'</td><td class="n">'+(r.mode==='fastest'?(p.done?fmtTime(p.timeMs,true):'not finished'):fmtTime((r.limitSec||0)*1000))+'</td><td class="n">'+(p.missed||0)+'</td></tr>'}).join('')+'</tbody></table>'
    :'<p>No students played this round.</p>';
  $('#repMiss').innerHTML=miss.length?'<div class="tw"><table><thead><tr><th>Word</th><th class="n">Reached the bottom</th><th class="n">Typing slips</th><th class="n">Students</th></tr></thead><tbody>'
    +miss.map(function(m){return '<tr><td><b>'+esc(m.w)+'</b></td><td class="n">'+m.m+'</td><td class="n">'+m.s+'</td><td class="n">'+m.kids+'</td></tr>'}).join('')+'</tbody></table></div>'
    :'<p>No missed words. What a class!</p>';
}
async function playAgain(){
  await dbRetry(function(){return DB.doc('rooms/'+S.code).update({status:'lobby',round:(S.room.round||1)+1,startAt:0,endedAt:0,expiresAt:Math.max(S.room.expiresAt,now()+6*3600*1000)})});
  S.ending=false;
}
/* ----- CSV export (uses the downloads capability; falls back to copyable text) ----- */
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(){
  var r=S.room,rep=S.report,rows=[['Rank','Name','Words right','Accuracy %','Time','Words missed','Typing slips','Mode','Room','List','Date']];
  rep.ranked.forEach(function(p){
    var tot=(p.correct||0)+(p.missed||0);
    rows.push([p._rank,p.name,p.correct||0,tot?Math.round(100*p.correct/tot):'',r.mode==='fastest'?(p.done?fmtTime(p.timeMs,true):'not finished'):fmtTime(r.limitSec*1000),p.missed||0,p.slips||0,r.mode==='most'?'Most words':'Fastest time',r.code,r.listName,new Date(r.createdAt).toISOString().slice(0,10)]);
  });
  rows.push([]);rows.push(['Word','Reached the bottom','Typing slips','Students']);
  rep.miss.forEach(function(m){rows.push([m.w,m.m,m.s,m.kids])});
  return '﻿'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
async function exportCsv(){
  var csv=buildCsv(),name='spelling-results-'+S.room.code+'.csv';
  try{var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloading '+name);return}catch(e){}
  $('#csvBox').innerHTML='<div class="card stack"><h3>Copy your results</h3><p class="muted">Saving a file isn’t available here. Copy this text into a spreadsheet.</p><textarea id="csvText" readonly></textarea><button class="btn blue" data-act="csv-copy">Copy</button></div>';
  $('#csvText').value=csv;
}
async function kick(slug){
  var removed=(S.room.removed||[]).concat([slug]);
  await dbRetry(function(){return DB.doc('rooms/'+S.code).update({removed:removed})});
  await dbRetry(function(){return DB.doc('rooms/'+S.code+'/players/'+slug).delete()});
  toast('Student removed');
}

/* =====================================================================
   LEAVING ROOMS / ROUTING / EVENTS
   ===================================================================== */
function leaveRoom(){
  S.subs.forEach(function(f){try{f()}catch(e){}});S.subs=[];
  if(S.tick){clearInterval(S.tick);S.tick=null}
  var o=$('#tcd');if(o)o.remove();
  $$('.fullcd').forEach(function(n){n.remove()});
  stopEngine();G=null;
  S.code=null;S.room=null;S.players=[];S.player=null;S.slug=null;S.writer=null;S.cd=false;S.ending=false;
}
var ACT={
  'home':function(){if(S.view==='game'&&G&&!G.solo&&!G.over){toast('Finish this round first!');return}S.role=null;renderHome()},
  'sound':function(){Snd.muted=!Snd.muted;store.set('muted',Snd.muted);applyPrefs()},
  'font':function(){store.set('dys',!store.get('dys',false));applyPrefs()},
  'role-teacher':function(){S.role='teacher';renderTeacherGate()},
  'role-student':function(){S.role='student';renderStudent()},
  'back-student':function(){S.role='student';renderStudent()},
  'join':doJoin,'rejoin':function(){S.role='student';rejoin()},
  'host-new':function(){S.role='student';renderHostSetup()},
  'leave-game':function(){var c=S.code,sl=S.slug;S.role=null;leaveRoom();store.del('sp_session');renderHome();if(DB&&c&&sl){try{DB.doc('rooms/'+c+'/players/'+sl).delete().catch(function(){})}catch(e){}}toast('You left the room')},
  'hs-mode':function(b){S.hs.mode=b.dataset.v;renderHostSetup()},
  'hs-speed':function(b){S.hs.speed=+b.dataset.i;renderHostSetup()},
  'hs-limit':function(b){S.hs.limit=+b.dataset.v;renderHostSetup()},
  'hs-create':createHostRoom,
  'host-start':hostStart,
  'host-again':playAgain,
  'host-end':endRoom,
  'host-close':async function(){var c=S.code;leaveRoom();store.del('sp_session');S.role=null;renderHome();try{await deleteRoom(c);toast('Room closed')}catch(e){}},
  'solo':function(){S.role=S.role||'student';renderSolo()},
  'solo-speed':function(b){S.soloSpeed=+b.dataset.i;renderSolo()},
  'solo-go':function(){startSolo(soloWords())},
  'solo-again':function(){startSolo(soloWords())},
  'practise-missed':function(){S.soloSel='missed';S.missedForPractice=S.missedForPractice||[];renderSolo()},
  'hear':function(b){S.hear=!S.hear;store.set('hear',S.hear);b.setAttribute('aria-pressed',S.hear?'true':'false');if(G&&G.typer)G.typer.focus()},
  'say':function(){if(!G)return;var w=lowest();if(w)speak(w.word);G.typer.focus()},
  'pause':togglePause,
  'gate-go':gateGo,
  't-lock':function(){sess.del('sp_t');S.role=null;renderHome()},
  't-back':function(){S.role='teacher';renderTeacherHome()},
  'tab':function(b){S.tab=b.dataset.tab;renderTeacherHome()},
  'pin-change':function(){
    var box=$('#pinbox');box.hidden=false;
    box.innerHTML='<div class="card stack"><h3>Change the shared PIN</h3><div><label for="npin">New PIN (at least 4 characters)</label><input id="npin" type="password" autocomplete="off"></div><div id="npErr" hidden></div><div class="row"><button class="btn primary small" data-act="pin-save">Save PIN</button><button class="btn small" data-act="pin-cancel">Cancel</button></div></div>';$('#npin').focus();
  },
  'pin-cancel':function(){$('#pinbox').hidden=true},
  'pin-save':async function(){
    var p=$('#npin').value,e=$('#npErr');
    if(p.length<4){e.hidden=false;e.className='err';e.textContent='Please use at least 4 characters.';return}
    var ph=await hashPin(p);
    try{await dbRetry(function(){return DB.doc('settings/school').set({pinHash:ph,createdAt:now()})});$('#pinbox').hidden=true;toast('PIN changed')}
    catch(err){e.hidden=false;e.className='err';e.textContent='Couldn’t save the PIN. Please try again.'}
  },
  'list-new':function(){openEditor(null)},
  'list-edit':function(b){openEditor(b.dataset.id)},
  'list-cancel':function(){$('#editor').hidden=true},
  'list-save':saveList,
  'list-dup':function(b){dupList(b.dataset.id)},
  'list-del':async function(b){await dbRetry(function(){return DB.doc('lists/'+b.dataset.id).delete()});toast('List deleted')},
  'list-sample':sampleList,
  'setup-new':function(b){S.setup=null;renderSetup(b&&b.dataset?b.dataset.id:null)},
  'su-mode':function(b){S.setup.mode=b.dataset.v;renderSetup()},
  'su-speed':function(b){S.setup.speed=+b.dataset.i;renderSetup()},
  'su-limit':function(b){S.setup.limit=+b.dataset.v;renderSetup()},
  'su-create':function(b){b.disabled=true;createRoom()},
  'room-open':function(b){openTeacherRoom(b.dataset.code)},
  'room-close':async function(b){var c=b.dataset.code;await deleteRoom(c);if(S.code===c){leaveRoom();renderTeacherHome()}toast('Room closed')},
  'start':startGame,
  'kick':function(b){kick(b.dataset.slug)},
  'end-now':endRoom,
  'play-again':playAgain,
  'csv':exportCsv,
  'csv-copy':function(){var t=$('#csvText');t.select();try{navigator.clipboard.writeText(t.value).then(function(){toast('Copied')},function(){toast('Press Ctrl+C to copy')})}catch(e){toast('Press Ctrl+C to copy')}}
};

/* Two-step confirmation (the viewer has no confirm() dialog) */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.hasAttribute('data-confirm')&&!b.classList.contains('armed')){
    var old=b.textContent;b.classList.add('armed');b.textContent='Tap again to confirm';
    setTimeout(function(){if(b.isConnected){b.classList.remove('armed');b.textContent=old}},3500);return;
  }
  var f=ACT[b.dataset.act];if(f)f(b,e);
});
/* Keep typing focused during play so tablets keep their keyboard up */
document.addEventListener('pointerup',function(e){
  if(S.view==='game'&&G&&!G.over&&!G.paused&&G.typer&&!e.target.closest('button'))G.typer.focus();
});

/* ---------- boot ---------- */
async function boot(){
  buildSea();applyPrefs();renderHome();
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    DB=makeFirebaseDB(firebase.database());
  }catch(e){console.warn('Firebase unavailable',e);DB=null}
  S.dbReady=true;
  if(S.view==='home')renderHome();
}
boot();
})();
</script>
